spring.application.name=makify
spring.config.import=optional:file:.env[.properties]
server.port=8001
server.forward-headers-strategy=native

# Timezone
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# File Upload Size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# JWT Settings
jwt.secret=${SPRING_JWT_SECRET}
jwt.access-token-validity=${SPRING_JWT_ACCESS_TOKEN_VALIDITY}
jwt.refresh-token-validity=${SPRING_JWT_REFRESH_TOKEN_VALIDITY}

# Swagger
springdoc.show-login-endpoint=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.xladmt.makify=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log

# Autocomplete - ???? Trie ??? ??? ?? ?? ??
# ?? ?? ?? ?? ?: logs/data-2026-02-06.log
# ?? ?? ?? ?: logs/data.log
autocomplete.log-file=logs/data-2026-02-06.log
# ?? ?? ??? (yyyy-MM-dd). ? ?? ?? ???? ??. ???? ?? ?? ?? ??
autocomplete.since-date=

# Logback Rollingpolicy - Daily Rotation
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.log

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


cloud.aws.s3.bucket.name=${CLOUD_AWS_S3_BUCKET_NAME}
cloud.aws.credentials.access-key=${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${CLOUD_AWS_CREDENTIALS_SECRET_KEY}
cloud.aws.region.static=${CLOUD_AWS_REGION_STATIC}