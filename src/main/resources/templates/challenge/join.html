<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" content="${_csrf.token}"/>
  <meta name="_csrf_header" content="${_csrf.headerName}"/>
  <title>챌린지 참여하기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <style>
    body {
      background-color: white;
    }

    .challenge-box {
      margin-top: 2rem;
      background-color: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #343a40;
    }

    .form-label {
      font-weight: 500;
    }

    .summary-box {
      background-color: #f1f3f5;
      padding: 1rem;
      border-radius: 0.5rem;
    }

    .btn-primary {
      background-color: #10b981 !important;
      border-color: #10b981 !important;
    }

    .btn-primary:hover {
      background-color: #059669 !important;
      border-color: #059669 !important;
    }
  </style>
  <script src="https://cdn.portone.io/v2/browser-sdk.esm.js" type="module"></script>
  <script type="text/javascript" src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script th:src="@{/js/navbar.js}"></script>
  <script type="module">
    import * as PortOne from "https://cdn.portone.io/v2/browser-sdk.esm.js";
    window.PortOne = PortOne;
  </script>
  <script>

    function initPayment(challengeId, userId) {
      fetch('/payment/init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          challengeId: challengeId,
          userId: userId,
          paymentAmount: 100
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log('결제 초기화 성공:', data);
          requestPay(data.uuid);
        } else {
          console.error('결제 초기화 실패:', data.message);
          alert('결제 초기화에 실패했습니다: ' + data.message);
        }
      })
      .catch(error => {
        console.error('결제 초기화 오류:', error);
        alert('결제 초기화 중 오류가 발생했습니다.');
      });
    }

    async function requestPay(uuid) {
      try {
        const response = await PortOne.requestPayment({
          storeId: 'store-4153e990-8de7-4c65-a411-47199ea3733f',                                          // 가맹점 식별코드
          channelKey: 'channel-key-dd622c42-27d0-47e4-9393-ec4364c5f44f', // 토스페이먼츠 테스트 채널키
          paymentId: uuid,
          orderName: '챌린지 참가비',
          totalAmount: 100,
          currency: 'KRW',
          payMethod: 'CARD',
          customer: {
            email: '[[${paymentInfo.buyerEmail}]]',
            fullName: '[[${paymentInfo.buyerName}]]',
          }
        });

        console.log('결제 응답:', response);

        if (response.code) {
          // 결제 실패 (사용자 취소 포함)
          console.log('결제 실패:', response.message);
          alert('결제에 실패했습니다: ' + response.message);
          verifyPayment(null, uuid);
        } else {
          // 결제 성공
          console.log('결제 성공, imp_uid:', response.paymentId);
          verifyPayment(response.paymentId, uuid);
        }
      } catch (error) {
        console.error('결제 오류:', error);
        alert('결제 중 오류가 발생했습니다.');
        verifyPayment(null, uuid);
      }
    }

    function verifyPayment(impUid, uuid) {
      console.log('결제 검증 요청:', 'impUid=' + impUid, 'uuid=' + uuid);

      fetch('/payment/callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          paymentUid: impUid,
          uuid: uuid
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          alert('챌린지 참여가 완료되었습니다!');
          window.location.href = '/challenges/' + '[[${challengeId}]]';
        } else {
          alert('결제 검증에 실패했습니다: ' + data.message);
          window.location.href = '/fail-payment';
        }
      })
      .catch(error => {
        console.error('결제 검증 오류:', error);
        window.location.href = '/fail-payment';
      });
    }

    function handlePayment() {
      const challengeId = '[[${challengeId}]]';
      const userId = '[[${userId}]]';

      const depositInput = document.getElementById('depositAmount');
      const errorDiv = document.getElementById('depositError');

      if (depositInput && !depositInput.value) {
        errorDiv.classList.remove('d-none');
        depositInput.classList.add('is-invalid');
        return;
      }

      if (errorDiv) errorDiv.classList.add('d-none');

      initPayment(challengeId, userId);
    }

    document.addEventListener("DOMContentLoaded", function () {
      const depositInput = document.getElementById('depositAmount');
      const errorDiv = document.getElementById('depositError');

      if (depositInput) {
        depositInput.addEventListener('input', function () {
          if (this.value) {
            errorDiv.classList.add('d-none');
            this.classList.remove('is-invalid');
          }
        });
      }
    });

  </script>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">
  <div class="challenge-box mx-auto" style="max-width: 720px;">
    <h2 class="fw-bold mb-4 text-center" th:text="${challenge.title}">챌린지 제목</h2>

    <!-- 챌린지 요약 -->
    <div class="summary-box mb-4">
      <p class="mb-2" th:text="${challenge.description}">챌린지 설명</p>
      <ul class="list-unstyled small">
        <li><strong>기간:</strong> <span th:text="${challenge.startDate}"></span> ~ <span th:text="${challenge.endDate}"></span></li>
        <li><strong>카테고리:</strong> <span th:text="${challenge.category}"></span></li>
        <li>
          <strong>예치금 유형:</strong>
          <span th:text="${challenge.isFixedDeposit.name() == 'Y'} ? '고정 예치금' : '유동 예치금'"></span>
        </li>
        <li><strong>최대 예치금:</strong> <span th:text="${#numbers.formatInteger(challenge.maxDeposit, 0, 'COMMA')} + '원'">0원</span></li>
      </ul>
    </div>

    <!-- 참여 조건 -->
    <div class="mb-4">
      <div class="section-title"><i class="bi bi-info-circle"></i> 참여 조건</div>
      <ul class="small">
        <li>예치금 결제가 필요합니다.</li>
        <li>정해진 인증 횟수를 달성하지 못하면 일부 금액이 환급되지 않을 수 있습니다.</li>
      </ul>
    </div>

    <!-- 결제 입력 -->
    <form th:action="@{'/challenges/' + ${challenge.id} + '/join'}" method="post">

      <div class="mb-4">
        <label for="depositAmount" class="form-label">결제 금액</label>

        <div th:if="${challenge.isFixedDeposit.name() == 'Y'}">
          <input type="number" class="form-control" id="depositFixAmount" name="depositAmount"
                 th:value="${challenge.maxDeposit}" readonly>
          <div class="form-text text-muted">이 챌린지는 고정 예치금 챌린지입니다.</div>
        </div>

        <div th:if="${challenge.isFixedDeposit.name() != 'Y'}">
          <input type="number" class="form-control" id="depositAmount" name="depositAmount"
                 th:placeholder="'원하는 금액을 입력하세요. (최소 1000원 ~ 최대 ' + ${#numbers.formatInteger(challenge.maxDeposit, 0, 'COMMA')} + '원 이하)'"
                 min="1000" th:attr="max=${challenge.maxDeposit}" required>
          <div class="text-danger small mt-1 d-none" id="depositError">
            결제 금액을 입력해주세요.
          </div>
        </div>
      </div>

      <!-- 보유 자산 사용 -->
      <div class="mb-4">
        <label class="form-label">보유 예치금 / 상금 사용</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="useBalance" name="useBalance">
          <label class="form-check-label" for="useBalance">사용하기</label>
        </div>
      </div>

      <!-- 약관 동의 -->
      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="agree" required>
          <label class="form-check-label" for="agree">
            <a href="/policy" target="_blank">운영정책</a> 및 <a href="/terms" target="_blank">이용약관</a>에 동의합니다.
          </label>
        </div>
      </div>

      <!-- 참여 버튼 -->
      <button type="button" class="btn btn-primary btn-lg w-100" onclick="handlePayment()">결제하기</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
