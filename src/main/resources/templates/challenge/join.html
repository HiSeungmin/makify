<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" content="${_csrf.token}"/>
  <meta name="_csrf_header" content="${_csrf.headerName}"/>
  <title>챌린지 참여하기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <style>
    body {
      background-color: white;
    }

    .challenge-box {
      margin-top: 2rem;
      background-color: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #343a40;
    }

    .form-label {
      font-weight: 500;
    }

    .summary-box {
      background-color: #f1f3f5;
      padding: 1rem;
      border-radius: 0.5rem;
    }

    .btn-primary {
      background-color: #10b981 !important;
      border-color: #10b981 !important;
    }

    .btn-primary:hover {
      background-color: #059669 !important;
      border-color: #059669 !important;
    }
  </style>
  <script src="https://cdn.portone.io/v2/browser-sdk.esm.js" type="module"></script>
  <script type="text/javascript" src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script th:src="@{/js/navbar.js}"></script>
  <script type="module">
    import * as PortOne from "https://cdn.portone.io/v2/browser-sdk.esm.js";
    window.PortOne = PortOne;
  </script>
  <script>

    function initPayment(challengeId, userId) {
      fetch('/payment/init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          challengeId: challengeId,
          userId: userId,
          paymentAmount: 100
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log('결제 초기화 성공:', data);
          requestPay(data.uuid);
        } else {
          console.error('결제 초기화 실패:', data.message);
          alert('결제 초기화에 실패했습니다: ' + data.message);
        }
      })
      .catch(error => {
        console.error('결제 초기화 오류:', error);
        alert('결제 초기화 중 오류가 발생했습니다.');
      });
    }

    async function requestPay(uuid) {
      try {
        const response = await PortOne.requestPayment({
          storeId: 'store-4153e990-8de7-4c65-a411-47199ea3733f',                                          // 가맹점 식별코드
          channelKey: 'channel-key-dd622c42-27d0-47e4-9393-ec4364c5f44f', // 토스페이먼츠 테스트 채널키
          paymentId: uuid,
          orderName: '챌린지 참가비',
          totalAmount: 100,
          currency: 'KRW',
          payMethod: 'CARD',
          customer: {
            email: '[[${paymentInfo.buyerEmail}]]',
            fullName: '[[${paymentInfo.buyerName}]]',
          }
        });

        console.log('결제 응답:', response);

        if (response.code) {
          // 결제 실패 (사용자 취소 포함)
          console.log('결제 취소 또는 실패:', response.message);
          window.location.href = '/challenges/' + '[[${challengeId}]]';
        } else {
          // 결제 성공
          console.log('결제 성공, imp_uid:', response.paymentId);
          verifyPayment(response.paymentId, uuid);
        }
      } catch (error) {
        console.error('결제 오류:', error);
        window.location.href = '/challenges/' + '[[${challengeId}]]';
      }
    }

    function verifyPayment(impUid, uuid) {
      console.log('결제 검증 요청:', 'impUid=' + impUid, 'uuid=' + uuid);

      fetch('/payment/callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          paymentUid: impUid,
          uuid: uuid
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          alert('챌린지 참여가 완료되었습니다!');
          window.location.href = '/challenges/' + '[[${challengeId}]]';
        } else {
          alert('결제 검증에 실패했습니다: ' + data.message);
          window.location.href = '/challenges/' + '[[${challengeId}]]';
        }
      })
      .catch(error => {
        console.error('결제 검증 오류:', error);
        window.location.href = '/challenges/' + '[[${challengeId}]]';
      });
    }

    function handlePayment() {
      const challengeId = '[[${challengeId}]]';
      const userId = '[[${userId}]]';
      const isPublic = '[[${challenge.isPublic.name()}]]';

      const depositInput = document.getElementById('depositAmount');
      const errorDiv = document.getElementById('depositError');

      if (depositInput && !depositInput.value) {
        errorDiv.classList.remove('d-none');
        depositInput.classList.add('is-invalid');
        return;
      }

      if (errorDiv) errorDiv.classList.add('d-none');

      // 약관 동의 체크
      const agreeCheck = document.getElementById('agree');
      const agreeError = document.getElementById('agreeError');
      if (!agreeCheck.checked) {
        agreeError.classList.remove('d-none');
        agreeCheck.closest('.form-check').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      agreeError.classList.add('d-none');

      // 비공개 챌린지면 코드 먼저 검증
      if (isPublic === 'N') {
        const codeVerified = document.getElementById('privateCodeSection')?.dataset.verified;
        if (codeVerified !== 'true') {
          document.getElementById('codeError').classList.remove('d-none');
          document.getElementById('codeError').textContent = '먼저 참여 코드를 확인해주세요.';
          return;
        }
      }

      initPayment(challengeId, userId);
    }

    async function verifyCode() {
      const challengeId = '[[${challengeId}]]';
      const code = document.getElementById('privateCodeInput').value.trim();
      const errorDiv = document.getElementById('codeError');
      const successDiv = document.getElementById('codeSuccess');

      if (!code) {
        errorDiv.textContent = '참여 코드를 입력해주세요.';
        errorDiv.classList.remove('d-none');
        successDiv.classList.add('d-none');
        return;
      }

      try {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

        const res = await fetch(`/api/challenges/${challengeId}/verify-code`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (data.valid) {
          successDiv.classList.remove('d-none');
          errorDiv.classList.add('d-none');
          document.getElementById('privateCodeSection').dataset.verified = 'true';
          document.getElementById('privateCodeInput').readOnly = true;
        } else {
          errorDiv.textContent = data.message || '참여 코드가 올바르지 않습니다.';
          errorDiv.classList.remove('d-none');
          successDiv.classList.add('d-none');
          document.getElementById('privateCodeSection').dataset.verified = 'false';
        }
      } catch (e) {
        errorDiv.textContent = '코드 확인 중 오류가 발생했습니다.';
        errorDiv.classList.remove('d-none');
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const depositInput = document.getElementById('depositAmount');
      const errorDiv = document.getElementById('depositError');

      if (depositInput) {
        depositInput.addEventListener('input', function () {
          if (this.value) {
            errorDiv.classList.add('d-none');
            this.classList.remove('is-invalid');
          }
        });
      }
    });

  </script>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">
  <div class="challenge-box mx-auto" style="max-width: 720px;">
    <h2 class="fw-bold mb-4 text-center" th:text="${challenge.title}">챌린지 제목</h2>

    <!-- 챌린지 요약 -->
    <div class="summary-box mb-4">
      <p class="mb-2" th:text="${challenge.description}">챌린지 설명</p>
      <ul class="list-unstyled small">
        <li><strong>기간:</strong> <span th:text="${challenge.startDate}"></span> ~ <span th:text="${challenge.endDate}"></span></li>
        <li><strong>카테고리:</strong> <span th:text="${challenge.category.getDescription()}"></span></li>
        <li>
          <strong>예치금 유형:</strong>
          <span th:text="${challenge.isFixedDeposit.name() == 'Y'} ? '고정 예치금' : '유동 예치금'"></span>
        </li>
        <li><strong>최대 예치금:</strong> <span th:text="${#numbers.formatInteger(challenge.maxDeposit, 0, 'COMMA')} + '원'">0원</span></li>
      </ul>
    </div>

    <!-- 비공개 챌린지 코드 입력 -->
    <div th:if="${challenge.isPublic.name() == 'N'}" class="mb-4" id="privateCodeSection">
      <div class="section-title"><i class="bi bi-lock-fill text-warning"></i> 비공개 챌린지</div>
      <p class="small text-muted mb-2">이 챌린지는 비공개입니다. 참여하려면 초대 코드를 입력해주세요.</p>
      <div class="input-group">
        <input type="text" id="privateCodeInput" class="form-control" placeholder="참여 코드를 입력하세요">
        <button type="button" class="btn btn-outline-secondary" onclick="verifyCode()">확인</button>
      </div>
      <div id="codeError" class="text-danger small mt-1 d-none">참여 코드가 올바르지 않습니다.</div>
      <div id="codeSuccess" class="text-success small mt-1 d-none"><i class="bi bi-check-circle"></i> 코드가 확인되었습니다.</div>
    </div>

    <!-- 참여 조건 -->
    <div class="mb-4">
      <div class="section-title"><i class="bi bi-info-circle"></i> 참여 조건</div>
      <ul class="small">
        <li>예치금 결제가 필요합니다.</li>
        <li>정해진 인증 횟수를 달성하지 못하면 일부 금액이 환급되지 않을 수 있습니다.</li>
      </ul>
    </div>

    <!-- 결제 입력 -->
    <form th:action="@{'/challenges/' + ${challenge.id} + '/join'}" method="post">

      <div class="mb-4">
        <label for="depositAmount" class="form-label">결제 금액</label>

        <div th:if="${challenge.isFixedDeposit.name() == 'Y'}">
          <input type="number" class="form-control" id="depositFixAmount" name="depositAmount"
                 th:value="${challenge.maxDeposit.intValue()}" readonly>
          <div class="form-text text-muted">이 챌린지는 고정 예치금 챌린지입니다.</div>
        </div>

        <div th:if="${challenge.isFixedDeposit.name() != 'Y'}">
          <input type="number" class="form-control" id="depositAmount" name="depositAmount"
                 th:placeholder="'원하는 금액을 입력하세요. (최소 1000원 ~ 최대 ' + ${#numbers.formatInteger(challenge.maxDeposit, 0, 'COMMA')} + '원 이하)'"
                 min="1000" th:attr="max=${challenge.maxDeposit}" required>
          <div class="text-danger small mt-1 d-none" id="depositError">
            결제 금액을 입력해주세요.
          </div>
        </div>
      </div>

      <!-- 보유 자산 사용 -->
<!--      <div class="mb-4">-->
<!--        <label class="form-label">보유 예치금 / 상금 사용</label>-->
<!--        <div class="form-check">-->
<!--          <input class="form-check-input" type="checkbox" id="useBalance" name="useBalance">-->
<!--          <label class="form-check-label" for="useBalance">사용하기</label>-->
<!--        </div>-->
<!--      </div>-->

      <!-- 약관 동의 -->
      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="agree" required>
          <label class="form-check-label" for="agree">
            <a href="#" onclick="openModal('policy'); return false;">운영정책</a> 및
            <a href="#" onclick="openModal('terms'); return false;">이용약관</a>에 동의합니다.
          </label>
        </div>
        <div id="agreeError" class="text-danger small mt-1 d-none">운영정책 및 이용약관에 동의해주세요.</div>
      </div>

      <!-- 참여 버튼 -->
      <button type="button" class="btn btn-primary btn-lg w-100" onclick="handlePayment()">결제하기</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/navbar.js}"></script>

<!-- 운영정책 / 이용약관 모달 -->
<div id="policyModal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.45); align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:14px; width:90%; max-width:520px; max-height:75vh; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.18);">
    <div style="padding:1.2rem 1.5rem; border-bottom:1px solid #e9ecef; display:flex; justify-content:space-between; align-items:center;">
      <h6 id="modalTitle" style="margin:0; font-weight:700; font-size:1rem;"></h6>
      <button onclick="closeModal()" style="background:none; border:none; font-size:1.3rem; cursor:pointer; color:#6c757d; line-height:1;">&times;</button>
    </div>
    <div id="modalBody" style="padding:1.2rem 1.5rem; overflow-y:auto; font-size:0.88rem; line-height:1.7; color:#343a40;"></div>
    <div style="padding:0.9rem 1.5rem; border-top:1px solid #e9ecef; text-align:right;">
      <button onclick="closeModal()" style="background:#10b981; color:#fff; border:none; border-radius:8px; padding:0.45rem 1.3rem; font-weight:600; cursor:pointer;">확인</button>
    </div>
  </div>
</div>

<script>
  const modalContents = {
    policy: {
      title: '운영정책',
      body: `
        <h6 style="font-weight:700; margin-bottom:0.5rem;">1. 챌린지 참여 및 예치금 정책</h6>
        <p>챌린지 참여 시 설정된 예치금을 결제해야 하며, 챌린지 시작 이후에는 환불이 불가합니다.<br>
        예치금은 챌린지 종료 후 달성 여부에 따라 환급됩니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">2. 인증 규정</h6>
        <p>인증은 지정된 시간 내에만 가능하며, 하루 최소 인증 횟수를 달성하지 못하면 해당 일은 실패로 처리됩니다.<br>
        허위 인증, 타인 사진 도용, 조작된 이미지 업로드 등의 행위는 즉시 퇴출 및 예치금 몰수 처리됩니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">3. 부정 행위 처리</h6>
        <p>부정 행위가 적발된 경우 서비스 이용이 영구 제한될 수 있으며, 예치금은 반환되지 않습니다.<br>
        다른 참여자의 신고로 확인된 부정 행위도 동일하게 처리됩니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">4. 챌린지 강제 종료</h6>
        <p>운영 정책 위반, 참여자 수 미달, 기타 운영 판단에 따라 챌린지가 조기 종료될 수 있습니다.<br>
        이 경우 참여 기간에 비례하여 예치금이 환급됩니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">5. 분쟁 해결</h6>
        <p>챌린지 진행 중 발생하는 분쟁은 운영팀의 최종 판단을 따릅니다.<br>
        문의사항은 고객센터를 통해 접수해주세요.</p>
      `
    },
    terms: {
      title: '이용약관',
      body: `
        <h6 style="font-weight:700; margin-bottom:0.5rem;">제1조 (목적)</h6>
        <p>본 약관은 Makify(이하 "서비스")가 제공하는 챌린지 참여 서비스의 이용 조건 및 절차에 관한 사항을 규정합니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제2조 (회원 가입 및 자격)</h6>
        <p>서비스 이용을 위해 회원 가입이 필요하며, 만 14세 미만은 가입이 제한됩니다.<br>
        타인의 정보를 도용하거나 허위 정보로 가입한 경우 서비스 이용이 제한됩니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제3조 (서비스 이용)</h6>
        <p>회원은 본 약관 및 운영정책을 준수하여 서비스를 이용해야 합니다.<br>
        서비스 내 콘텐츠(챌린지 정보, 인증 사진 등)의 무단 복제 및 배포를 금지합니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제4조 (결제 및 환불)</h6>
        <p>챌린지 참여를 위한 예치금은 서비스 내 결제 수단을 통해 납부합니다.<br>
        챌린지 시작 전 취소 시 전액 환불되며, 시작 후에는 환불이 불가합니다.<br>
        서비스 장애 등 회사 귀책 사유 발생 시 전액 환불을 보장합니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제5조 (개인정보 보호)</h6>
        <p>서비스는 개인정보 보호법에 따라 회원의 개인정보를 보호하며, 별도의 개인정보처리방침에 따라 관리합니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제6조 (서비스 변경 및 중단)</h6>
        <p>서비스는 운영상 필요에 따라 서비스 내용을 변경하거나 중단할 수 있으며, 이 경우 사전에 공지합니다.</p>

        <h6 style="font-weight:700; margin-bottom:0.5rem;">제7조 (준거법 및 관할)</h6>
        <p>본 약관은 대한민국 법률에 따르며, 분쟁 발생 시 서울중앙지방법원을 관할 법원으로 합니다.</p>
      `
    }
  };

  function openModal(type) {
    const content = modalContents[type];
    document.getElementById('modalTitle').textContent = content.title;
    document.getElementById('modalBody').innerHTML = content.body;
    const modal = document.getElementById('policyModal');
    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('policyModal').style.display = 'none';
  }

  // 모달 바깥 클릭 시 닫기
  document.getElementById('policyModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
