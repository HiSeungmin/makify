<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<body>
<header class="habit-header" th:fragment="navbar">
  <link rel="manifest" href="/manifest.json">
  <a href="/" class="habit-logo">
    <div class="habit-logo-icon">
      <i class="bi bi-check2-circle"></i>
    </div>
    Makify
    <span class="habit-beta-badge">Beta</span>
  </a>

  <nav>
    <ul class="habit-nav-menu" id="habitNavMenu">
      <li><a href="/">홈</a></li>
      <li><a href="/challenges">챌린지</a></li>
      <li><a href="/feed">인증 피드</a></li>
    </ul>
  </nav>

  <button class="habit-mobile-toggle" id="mobileToggleBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- 데스크탑 액션 -->
  <div class="habit-nav-actions">
    <div sec:authorize="isAuthenticated()" class="nav-auth-group">
      <a href="/notifications" class="habit-btn-login notification-bell" id="notificationBell">
        <i class="bi bi-bell"></i>
        <span class="notification-badge" id="notificationBadge" style="display:none">0</span>
      </a>
      <a href="/mypage" class="habit-btn-login">
        <i class="bi bi-person"></i> 마이페이지
      </a>
      <button class="habit-btn-login" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> 로그아웃
      </button>
      <button class="habit-btn-login" id="pushPermissionBtn" style="display:none" title="알림 허용">
        <i class="bi bi-bell-slash"></i>
      </button>
    </div>
    <div sec:authorize="!isAuthenticated()" class="nav-auth-group">
      <a href="/login" class="habit-btn-login">로그인</a>
    </div>
  </div>

  <!-- 모바일 오버레이 -->
  <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

  <!-- 모바일 서랍 -->
  <div class="mobile-menu-drawer" id="mobileMenuDrawer">
    <ul>
      <li><a href="/">홈</a></li>
      <li><a href="/challenges">챌린지</a></li>
      <li><a href="/feed">인증 피드</a></li>
      <li class="mobile-divider" sec:authorize="isAuthenticated()"></li>
      <li sec:authorize="isAuthenticated()"><a href="/notifications"><i class="bi bi-bell"></i> 알림</a></li>
      <li sec:authorize="isAuthenticated()"><a href="/mypage"><i class="bi bi-person"></i> 마이페이지</a></li>
      <li sec:authorize="isAuthenticated()"><button id="mobileLogoutBtn"><i class="bi bi-box-arrow-right"></i> 로그아웃</button></li>
      <li class="mobile-divider" sec:authorize="!isAuthenticated()"></li>
      <li sec:authorize="!isAuthenticated()"><a href="/login">로그인</a></li>
      <li sec:authorize="isAuthenticated()" id="mobilePushPermissionItem" style="display:none">
        <button id="mobilePushPermissionBtn"><i class="bi bi-bell-slash"></i> 알림 허용하기</button>
      </li>
    </ul>
  </div>

  <!-- navbar 인라인 스크립트 — onclick 대신 addEventListener 사용 -->
  <script>
    (function() {
      function _toggleMenu() {
        var overlay = document.getElementById('mobileMenuOverlay');
        var drawer  = document.getElementById('mobileMenuDrawer');
        var toggle  = document.getElementById('mobileToggleBtn');
        if (!overlay || !drawer) return;
        var isActive = drawer.classList.contains('active');
        if (isActive) {
          _closeMenu();
        } else {
          overlay.classList.add('active');
          drawer.classList.add('active');
          toggle.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      }

      function _closeMenu() {
        var overlay = document.getElementById('mobileMenuOverlay');
        var drawer  = document.getElementById('mobileMenuDrawer');
        var toggle  = document.getElementById('mobileToggleBtn');
        if (!overlay || !drawer) return;
        overlay.classList.remove('active');
        drawer.classList.remove('active');
        if (toggle) toggle.classList.remove('active');
        document.body.style.overflow = '';
      }

      // 햄버거 버튼
      document.getElementById('mobileToggleBtn').addEventListener('click', _toggleMenu);

      // 오버레이 클릭 시 닫기
      document.getElementById('mobileMenuOverlay').addEventListener('click', _closeMenu);

      // 서랍 내 링크 클릭 시 닫기
      document.getElementById('mobileMenuDrawer').querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', _closeMenu);
      });

      // 로그아웃 버튼 (데스크탑)
      var logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function() {
          if (typeof logout === 'function') logout();
        });
      }

      // 로그아웃 버튼 (모바일)
      var mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
      if (mobileLogoutBtn) {
        mobileLogoutBtn.addEventListener('click', function() {
          if (typeof logout === 'function') logout();
        });
      }

      // navbar.js의 toggleMobileMenu와 연결
      window.toggleMobileMenu = _toggleMenu;
      window.closeMobileMenu  = _closeMenu;
    })();
  </script>

</header>

<!-- 알림 권한 모달 -->
<div id="pushPermissionModal" style="
  display:none; position:fixed; inset:0; z-index:9999;
  background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div style="
    background:#fff; border-radius:16px; padding:32px 24px;
    max-width:320px; width:90%; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <div style="font-size:48px; margin-bottom:16px;">🔔</div>
    <h3 style="margin:0 0 8px; font-size:18px;">알림을 허용해주세요</h3>
    <p style="margin:0 0 24px; font-size:14px; color:#666; line-height:1.6;">
      챌린지 인증 시간, 새 댓글 등<br>중요한 알림을 놓치지 마세요
    </p>
    <button id="pushPermissionAllowBtn" style="
      width:100%; padding:12px; background:#000; color:#fff;
      border:none; border-radius:8px; font-size:15px; cursor:pointer; margin-bottom:8px;">
      알림 허용하기
    </button>
    <button id="pushPermissionDenyBtn" style="
      width:100%; padding:12px; background:none; color:#999;
      border:none; font-size:14px; cursor:pointer;">
      나중에 하기
    </button>
  </div>
</div>
</body>
</html>
