<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 - Makify</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/notifications.css">
</head>
<body>
    <div th:insert="fragments/navbar :: navbar"></div>

    <main class="notifications-container">
        <div class="notifications-content">
            <div class="notifications-header">
                <h1 class="notifications-title">알림</h1>
                <button class="notifications-mark-all" id="markAllAsRead">모두 읽음으로 표시</button>
            </div>

            <!-- 알림 필터 탭 -->
            <div class="notifications-filters">
                <button class="filter-tab active" data-filter="all">
                    <span>전체</span>
                </button>
                <button class="filter-tab" data-filter="challenge">
                    <i class="bi bi-target"></i>
                    <span>챌린지</span>
                </button>
                <button class="filter-tab" data-filter="payment">
                    <i class="bi bi-credit-card"></i>
                    <span>결제</span>
                </button>
                <button class="filter-tab" data-filter="community">
                    <i class="bi bi-chat-dots"></i>
                    <span>커뮤니티</span>
                </button>
                <button class="filter-tab" data-filter="system">
                    <i class="bi bi-gear"></i>
                    <span>시스템</span>
                </button>
            </div>

            <!-- 알림 목록 — JS(notifications.js)가 API 응답으로 동적 렌더링 -->
            <div class="notifications-list" id="notificationsList"></div>

            <!-- 빈 상태 (옵션) -->
            <div class="notifications-empty" style="display: none;">
                <div class="empty-icon">
                    <i class="bi bi-inbox"></i>
                </div>
                <h3>알림이 없습니다</h3>
                <p>새로운 알림이 도착하면 여기에 표시됩니다.</p>
            </div>
        </div>
    </main>

    <div th:insert="fragments/footer :: footer"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/notifications.js"></script>
</body>
</html>
