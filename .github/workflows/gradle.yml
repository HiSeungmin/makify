# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read


    env:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:${{ secrets.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}
      SPRING_DATASOURCE_URL:${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME:${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD:${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SPRING_JWT_SECRET:${{ secrets.SPRING_JWT_SECRET }}
      SPRING_JWT_ACCESS_TOKEN_VALIDITY:${{ secrets.SPRING_JWT_ACCESS_TOKEN_VALIDITY }}
      SPRING_JWT_REFRESH_TOKEN_VALIDITY:${{ secrets.SPRING_JWT_REFRESH_TOKEN_VALIDITY }}
      SPRING_REDIS_HOST:${{ secrets.SPRING_REDIS_HOST }}
      SPRING_REDIS_PORT:${{ secrets.SPRING_REDIS_PORT }}
      IAMPORT_API_KEY:${{ secrets.IAMPORT_API_KEY }}
      IAMPORT_SECRET_KEY:${{ secrets.IAMPORT_SECRET_KEY }}
      CLOUD_AWS_S3_BUCKET_NAME:${{ secrets.CLOUD_AWS_S3_BUCKET_NAME }}
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY:${{ secrets.CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}
      CLOUD_AWS_CREDENTIALS_SECRET_KEY:${{ secrets.CLOUD_AWS_CREDENTIALS_SECRET_KEY }}
      CLOUD_AWS_REGION_STATIC:${{ secrets.CLOUD_AWS_REGION_STATIC }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
